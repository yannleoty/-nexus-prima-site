<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="robots" content="noindex">
  <title>Nexus Prima — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px; background: #050505; color: #f4f4f4; font-family: Arial, Helvetica, sans-serif; line-height: 1.6; }
    main { width: 100%; max-width: 34rem; }
    .wordmark { font-size: 1rem; letter-spacing: .12em; margin: 0 0 3rem; }
    .wordmark span { color: #ef3348; }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.15; }
    p { color: #a5a5ab; font-size: 1rem; }
    a { display: inline-block; min-height: 44px; margin-top: 1.5rem; padding: .7rem 1.2rem; border: 1px solid #ef3348; border-radius: 4px; color: #f4f4f4; text-decoration: none; }
    a:hover { background: #191013; }
    a:focus-visible { outline: 2px solid #f4f4f4; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="wordmark">NEXUS <span>PRIMA</span></p>
    <h1>You are offline.</h1>
    <p>Reconnect to explore Nexus Prima’s studies and four horizons of civilisation.</p>
    <p>The website and its illustrations need an internet connection.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
